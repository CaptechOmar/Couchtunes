# Flatpak manifest template. scripts/build-flatpak.sh renders it into flatpak/out/ (filling in the app id) and builds it.
# The app is the Electron build from desktop/ (run `npm run dist:linux` there first),
# so nothing is compiled or downloaded during the Flatpak build itself.
app-id: "@APP_ID@"
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: couchtunes
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network          # reaches your music server
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-data/icons:ro   # your mouse cursor theme
  - --filesystem=~/.icons:ro
  - --device=all             # game controllers (/dev/input)
  - --own-name=org.mpris.MediaPlayer2.chromium.*   # media keys and desktop media controls

modules:
  - name: couchtunes
    buildsystem: simple
    build-commands:
      - cp -r couchtunes-app /app/couchtunes
      - install -Dm755 couchtunes.sh /app/bin/couchtunes
      - install -Dm644 couchtunes.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 couchtunes.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 couchtunes-512.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 couchtunes-256.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 couchtunes-128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
    sources:
      - type: dir
        path: ../../desktop/dist/linux-unpacked
        dest: couchtunes-app
      - type: file
        path: couchtunes.sh
      - type: file
        path: couchtunes.desktop
      - type: file
        path: couchtunes.metainfo.xml
      - type: file
        path: couchtunes-512.png
      - type: file
        path: couchtunes-256.png
      - type: file
        path: couchtunes-128.png
