name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  webos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: scripts/build-webos.sh dist/webos
      - uses: actions/upload-artifact@v4
        with: { name: webos, path: dist/webos/*.ipk }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist:linux
        working-directory: desktop
      - name: Make the AppImage self-updating (Gear Lever) and create its .zsync file
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsync
          scripts/make-zsync.sh desktop/dist/*.AppImage "${{ github.repository_owner }}" "${{ github.event.repository.name }}"
      - name: Keep the unpacked app (with its permissions) for the Flatpak job
        run: tar czf unpacked.tgz -C desktop/dist linux-unpacked
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 'desktop/dist/*.AppImage*' }
      - uses: actions/upload-artifact@v4
        with: { name: linux-unpacked, path: unpacked.tgz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*-windows-portable.exe }

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-unpacked }
      - name: Unpack the app and fill in the app id
        id: render
        run: |
          mkdir -p desktop/dist
          tar xzf unpacked.tgz -C desktop/dist
          BRANCH=master; case "${{ github.ref_name }}" in *-*) BRANCH=beta;; esac   # pre-releases go to the beta channel
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "id=$(scripts/render-flatpak.sh '${{ github.repository_owner }}' "$BRANCH")" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Couchtunes.flatpak
          branch: ${{ steps.render.outputs.branch }}
          manifest-path: flatpak/out/${{ steps.render.outputs.id }}.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: Couchtunes.flatpak }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [webos, linux, windows, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{webos,linux,windows,flatpak}'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  homebrew-repo:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')   # pre-releases never reach the Homebrew Channel list
    needs: release
    runs-on: ubuntu-latest
    concurrency: { group: pages, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: webos, path: ipk }
      - run: node scripts/gen-hbc-repo.mjs ipk/*.ipk "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ github.ref_name }}" site
      - uses: actions/download-artifact@v4
        with: { name: flatpak, path: flatpak-bundle }
      - name: Build the signed Flatpak repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree gnupg
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
            export FLATPAK_GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          fi
          scripts/gen-flatpak-repo.sh flatpak-bundle/Couchtunes.flatpak "${{ github.repository_owner }}" "${{ github.event.repository.name }}" site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4

  flatpak-beta:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')   # pre-releases only update the Flatpak beta channel
    needs: release
    runs-on: ubuntu-latest
    concurrency: { group: pages, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: flatpak, path: flatpak-bundle }
      - name: Keep the Homebrew Channel files that are already published
        run: |
          mkdir -p site
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${{ github.event.repository.name }}"
          for f in apps.json com.cadence.navidrome.manifest.json icon-v2.png; do
            code="$(curl -s --retry 3 -o "site/$f" -w '%{http_code}' "$base/$f" || true)"
            if [ "$code" = 404 ]; then rm -f "site/$f"; elif [ "$code" != 200 ]; then echo "Could not fetch $f (HTTP $code); stopping so nothing gets overwritten."; exit 1; fi
          done
      - name: Build the signed Flatpak repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree gnupg
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
            export FLATPAK_GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          fi
          scripts/gen-flatpak-repo.sh flatpak-bundle/Couchtunes.flatpak "${{ github.repository_owner }}" "${{ github.event.repository.name }}" site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
